name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The plugin lives in the same repository and shares the page, nothing else. A change
    # confined to native/ is not a reason to redeploy the site — but a change to src/ is a reason
    # to build both, because the page belongs to both.
    paths-ignore:
      - 'native/**'
      - 'docs/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published, but never queue more
# than one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # macOS rather than ubuntu, and not for the build — for the test step below it. The suites run
  # under JavaScriptCore by way of `osascript -l JavaScript` (see scripts/jsrun.py), which exists
  # on no other platform, so the same `npm test` that gates the plugin cannot gate the page from
  # a Linux runner. The alternative was to drop the tests here and let native.yml carry them,
  # which would deploy a page nothing had checked.
  #
  # actions/upload-pages-artifact branches on runner.os and reaches for gtar on macOS, so the
  # GNU-only tar flags it packs with are not a problem here.
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        # Twenty-one suites over the music: the chord parser, the timeline, voice leading,
        # voicings, playback, the compiler, the shared document and the clipboard. They run in
        # JavaScriptCore rather than Node, which is also a standing proof that none of it needs
        # a browser — the thing the plugin depends on.
        run: npm test

      - name: Build
        # Builds the page and, beside it, the compiler bundle the plugin evaluates. Both are
        # wanted here: the second is small, and a page deployed without it would be a page whose
        # sibling build is untested.
        run: npm run build

      # `enablement` rather than a setting somebody has to remember. The repo
      # reports has_pages true while the API still has no site record for it,
      # which is the state this action refuses — it wants a site whose build
      # type is "workflow", and a Pages that was switched on without one, or
      # pointed at a branch, is not that. With this it creates or converts the
      # site itself; where the site is already right it does nothing. The
      # workflow already grants pages: write, which is all that needs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
