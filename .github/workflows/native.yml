name: Plugins

# The web app and the plugin share one repository and one page, and nothing else. Each has its
# own workflow with its own paths filter, so a change to a stylesheet does not spend twenty
# minutes building four bundles — and a change to src/ builds both, because the page is what the
# plugin serves.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'native/**'
      - 'src/**'
      - 'package.json'
      - 'vite.config.js'
      - 'vite.compile.config.js'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'src/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Sign and notarise (slow; normally only done for tags)'
        type: boolean
        default: false

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write   # the release job needs this; every other job only reads

jobs:
  # --------------------------------------------------------------------------------------------
  # The cheap gate. No compiler, no runner image to warm up, about a minute — so music code that
  # is wrong is caught here rather than by the slowest job on the matrix.
  # --------------------------------------------------------------------------------------------
  core:
    name: Music
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # JavaScriptCore, which is the same engine the plugin embeds — so this is not a stand-in
      # for the thing the plugin runs, it is that thing without a DAW attached.
      - name: Suites
        run: npm test

      # A release labelled v0.2.0 whose plugin reports 0.1.0 to the host is not caught by
      # anything else here: auval, pluginval and the suites are all perfectly happy with a
      # version that disagrees with its tag. It costs a second on the cheapest job, and the
      # alternative is finding out from a bug report about a version that was never shipped.
      - name: The tag agrees with the version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          cml=$(grep -oE 'project\(JaminNative VERSION [0-9.]+' native/CMakeLists.txt \
                | grep -oE '[0-9.]+$')
          echo "tag $tag · package.json $pkg · CMakeLists $cml"
          fail=false
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag but package.json says $pkg"; fail=true; }
          [ "$tag" = "$cml" ] || { echo "::error::tag $tag but native/CMakeLists.txt says $cml"; fail=true; }
          [ "$fail" = false ]

      - name: Build the page and the compiler
        run: npm run build

      # The page and the compiler bundle are built once here and handed to the platform jobs,
      # which need them inside their bundles and would otherwise each build them again.
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: dist/
          if-no-files-found: error

  # --------------------------------------------------------------------------------------------
  macos:
    name: macOS (universal)
    needs: core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: page
          path: dist

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: native/build/_deps
          key: juce-macos-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: juce-macos-

      - name: Configure
        run: |
          cmake -B native/build -S native -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build native/build

      - name: Universal
        run: |
          A=native/build/plugin
          for binary in \
            "$A/JaminInstrument_artefacts/RelWithDebInfo/AU/Jamin.component/Contents/MacOS/Jamin" \
            "$A/JaminInstrument_artefacts/RelWithDebInfo/VST3/Jamin.vst3/Contents/MacOS/Jamin" \
            "$A/JaminInstrument_artefacts/RelWithDebInfo/Standalone/Jamin.app/Contents/MacOS/Jamin" \
            "$A/JaminMidiFx_artefacts/RelWithDebInfo/AU/Jamin MIDI FX.component/Contents/MacOS/Jamin MIDI FX"; do
            archs=$(lipo -archs "$binary")
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) echo "  ok  $(basename "$binary")  $archs" ;;
              # A host launched under Rosetta does not refuse an arm64-only plugin, it never
              # lists it — with nothing in any log to say so. Worth failing a build over.
              *) echo "::error::$binary is not universal ($archs)"; exit 1 ;;
            esac
          done

      - name: Tests
        run: ctest --test-dir native/build --output-on-failure -LE installed

      # Which credentials this run actually has. A pull request from a fork has none, and must
      # still build and validate — so signing is a capability the run either has or does not,
      # never a step that fails for lacking a secret.
      - name: What credentials are available
        id: creds
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        run: |
          sign=false; notary=false
          [ -n "$CERT" ] && sign=true
          { [ -n "$NOTARY_KEY_P8" ] || [ -n "$NOTARY_APPLE_ID" ]; } && notary=true
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notary=$notary" >> "$GITHUB_OUTPUT"
          echo "signing: $sign · notarisation: $notary"

      # A throwaway keychain rather than the login one: it is deleted when the job ends, it never
      # holds anything but this certificate, and it cannot leave a private key behind on a runner
      # image if a later step fails.
      - name: Import the signing certificate
        if: steps.creds.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/jamin-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
                   -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$cert"

          # Without this, codesign blocks on a GUI prompt for keychain access that nothing on a
          # runner can ever answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null

          # `-s` *replaces* the search list rather than adding to it, so the old one is saved and
          # put back by the cleanup step. On a disposable runner that is merely tidy; the same
          # snippet on a real machine without it quietly hides every other keychain, which looks
          # exactly like the signing certificate having vanished.
          security list-keychain -d user | sed -E 's/^[[:space:]]*"?//; s/"?$//' \
            > "$RUNNER_TEMP/keychain-search-list"
          search_list=""
          while IFS= read -r entry; do
            [ -n "$entry" ] && search_list="$search_list \"$entry\""
          done < "$RUNNER_TEMP/keychain-search-list"
          eval "security list-keychain -d user -s \"$keychain\" $search_list"

          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application"

      # Signed before validation, so auval and pluginval exercise the bundles that actually ship
      # rather than the ones that happened to exist before signing changed them. This is also the
      # signing that counts: the build copies the page into each bundle after CMake has signed
      # it, which breaks that signature — see macos-sign.sh.
      - name: Sign
        if: steps.creds.outputs.sign == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./native/tools/macos-sign.sh native/build/plugin

      - name: auval
        run: |
          A=native/build/plugin
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/JaminInstrument_artefacts/RelWithDebInfo/AU/Jamin.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "$A/JaminMidiFx_artefacts/RelWithDebInfo/AU/Jamin MIDI FX.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2

          for component in ~/Library/Audio/Plug-Ins/Components/Jamin*.component; do
            plist="$component/Contents/Info.plist"
            type=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:type" "$plist")
            subtype=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:subtype" "$plist")
            manufacturer=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:manufacturer" "$plist")
            echo "auval -v $type $subtype $manufacturer"
            auval -v "$type" "$subtype" "$manufacturer"
          done

      # The installed gates: opening the editor and throwing it away, and doing that while a
      # sequence plays and MIDI arrives. auval never instantiates the editor, so it cannot see
      # what those see.
      - name: Host cycles
        run: ctest --test-dir native/build --output-on-failure -L installed

      # pluginval prints "FAILURE" at the very end and names the test that
      # failed two hundred lines earlier, in the middle of a run that logs a
      # line per sample rate. Read in a browser that collapses long logs, the
      # answer is the one part you cannot see — the first time this failed the
      # visible log contained twenty of the twenty-five sections and not the
      # one that mattered. So the failure is repeated at the end, where the
      # tail of the log always has it.
      - name: pluginval
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          A=native/build/plugin/JaminInstrument_artefacts/RelWithDebInfo
          set +e
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 --validate-in-process --timeout-ms 300000 \
            --validate "$A/VST3/Jamin.vst3" 2>&1 | tee pluginval.log
          status=${PIPESTATUS[0]}
          set -e
          [ "$status" -eq 0 ] && exit 0

          echo ""
          echo "================ what pluginval objected to ================"
          # -B/-A because the assertion and the section it belongs to are on
          # different lines, and the section is what makes it actionable.
          grep -nE '!!!|FAILED|failed|Error|error' pluginval.log | head -40 \
            || echo "(nothing matched — pluginval failed without naming a test)"
          echo ""
          echo "last section entered:"
          grep -E 'Starting tests in' pluginval.log | tail -1
          echo "============================================================"
          {
            echo "### pluginval failed"
            echo ""
            echo '```'
            grep -nE '!!!|FAILED|failed' pluginval.log | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The whole log, for when the tail is not enough. Only on a failure:
      # a passing run has nothing anybody needs to read.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pluginval-macos-log
          path: pluginval.log
          if-no-files-found: ignore

      - name: Notarise
        id: notarize
        if: >-
          steps.creds.outputs.sign == 'true' && steps.creds.outputs.notary == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || inputs.notarize)
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          ./native/tools/macos-notarize.sh native/build/plugin dist
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Collect
        run: |
          A=native/build/plugin
          mkdir -p out
          # After stapling these carry their notarisation tickets, so ditto rather than cp -R:
          # it is the copy that keeps the extended attributes a signed bundle depends on.
          ditto "$A/JaminInstrument_artefacts/RelWithDebInfo/AU/Jamin.component"   out/Jamin.component
          ditto "$A/JaminInstrument_artefacts/RelWithDebInfo/VST3/Jamin.vst3"      out/Jamin.vst3
          ditto "$A/JaminInstrument_artefacts/RelWithDebInfo/Standalone/Jamin.app" out/Jamin.app
          ditto "$A/JaminMidiFx_artefacts/RelWithDebInfo/AU/Jamin MIDI FX.component" "out/Jamin MIDI FX.component"

          {
            echo "### macOS"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| signed | ${{ steps.creds.outputs.sign }} |"
            echo "| notarised | ${{ steps.notarize.outputs.done || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jamin-macos-universal
          path: out/
          if-no-files-found: error

      # Only present when notarisation ran; that is what the release job publishes.
      - uses: actions/upload-artifact@v4
        if: steps.notarize.outputs.done == 'true'
        with:
          name: jamin-macos-release
          path: dist/
          if-no-files-found: error

      # `always()`, because a private key outliving the job that needed it is exactly the failure
      # this keychain exists to avoid.
      - name: Remove the keychain
        if: always() && steps.creds.outputs.sign == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/keychain-search-list" ]; then
            search_list=""
            while IFS= read -r entry; do
              [ -n "$entry" ] && search_list="$search_list \"$entry\""
            done < "$RUNNER_TEMP/keychain-search-list"
            [ -n "$search_list" ] && eval "security list-keychain -d user -s $search_list" || true
          fi
          security delete-keychain "$RUNNER_TEMP/jamin-signing.keychain-db" 2>/dev/null || true

  # --------------------------------------------------------------------------------------------
  # Windows gets the VST3 and the Standalone. There is no AU there, and no MIDI-effect category
  # in VST3 — the instrument is the shape that travels.
  #
  # It plays, because the engine that works out what to play is carried with us rather than
  # borrowed from the system: QuickJS, the same one macOS uses. And it shares, because the
  # sockets are spelled both ways from one set of sources — see core/include/jamin/Sockets.h for
  # the Winsock differences that compile without complaint and then misbehave, and Platform.h for
  # why `if (handle >= 0)` is never the right test.
  # --------------------------------------------------------------------------------------------
  windows:
    name: Windows (x64)
    needs: core
    runs-on: windows-latest
    # Not a blocker yet, and saying so in the workflow is more honest than a job everybody learns
    # to scroll past. Not one file here has ever been through MSVC — until this repository had a
    # remote there was nowhere for CI to run at all — so the first real compile will find things,
    # and none of them should stop a macOS build from publishing or hold up a release.
    #
    # This is a deliberate, temporary state, and it is the kind that quietly becomes permanent.
    # Take it off the moment the job goes green: from then on a Windows regression is a failure
    # worth having, and leaving this here would hide it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: page
          path: dist

      - name: Cache JUCE and QuickJS
        uses: actions/cache@v4
        with:
          path: native/build/_deps
          key: deps-windows-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: deps-windows-

      - name: Configure
        shell: bash
        run: cmake -B native/build -S native -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        shell: bash
        run: cmake --build native/build --config RelWithDebInfo

      # The networking is Winsock here and BSD sockets on the macOS job, from one
      # set of sources, and this is the run that would say the Windows half
      # works: two nodes finding each other, a chart passing between them, the
      # shared segment carrying an edit from one process to another.
      #
      # Would, because the discovery and node suites skip themselves where
      # multicast does not work, and on a hosted runner it does not — that is
      # what fifteen failures on the first macOS run turned out to be. What
      # still runs here is everything that needs no peer: the sequence, the
      # segment, the endpoint and the roster, compiled by MSVC rather than by
      # clang, which is most of what this job was for. The peer-to-peer half is
      # proved by running the suite on a real network — `JAMIN_REQUIRE_MULTICAST=1`
      # turns the skip back into a failure for exactly that.
      - name: Tests
        shell: bash
        run: ctest --test-dir native/build -C RelWithDebInfo --output-on-failure -LE installed

      - name: pluginval
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip -q pluginval.zip
          A=native/build/plugin/JaminInstrument_artefacts/RelWithDebInfo
          ./pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 \
            --validate "$A/VST3/Jamin.vst3"

      - name: Collect
        shell: bash
        run: |
          A=native/build/plugin/JaminInstrument_artefacts/RelWithDebInfo
          mkdir -p out
          cp -R "$A/VST3/Jamin.vst3" out/
          cp -R "$A/Standalone" out/Standalone

      - uses: actions/upload-artifact@v4
        with:
          name: jamin-windows-x64
          path: out/
          if-no-files-found: error

  # --------------------------------------------------------------------------------------------
  # Tags only. Everything that reached here has passed auval, pluginval, the host cycles and the
  # music suites.
  # --------------------------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        id: package
        run: |
          mkdir -p release
          # macOS: the notarised zips if notarisation ran, otherwise the plain bundles zipped
          # here — which install fine and simply warn on first open.
          if [ -d artifacts/jamin-macos-release ]; then
            cp artifacts/jamin-macos-release/*.zip release/
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            (cd artifacts/jamin-macos-universal && ditto -c -k --keepParent --sequesterRsrc . \
              "$GITHUB_WORKSPACE/release/jamin-macos-${GITHUB_REF_NAME}-unsigned.zip")
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

          # Only if the Windows job actually produced one. It is continue-on-error while the
          # MSVC build is being brought up, so a tagged release must be able to go out with the
          # macOS artefacts alone rather than failing at the last step over a platform that was
          # already known to be red.
          if [ -d artifacts/jamin-windows-x64 ]; then
            (cd artifacts/jamin-windows-x64 && zip -qr \
              "$GITHUB_WORKSPACE/release/jamin-windows-x64-${GITHUB_REF_NAME}.zip" .)
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no Windows artefact — releasing macOS only"
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

          ls -1 release

      # Whether these bundles are signed is not a property of the prose, it is a property of
      # what the macOS job was able to do — a fork has no certificate, and a release that says
      # "signed and notarised" over an unsigned zip is worse than one that says nothing. Same
      # for Windows: notes describing a download that is not in the release are worse than
      # notes that leave it out.
      - name: Release notes
        run: |
          notes=native/packaging/release-notes.md
          {
            echo "## jamin ${GITHUB_REF_NAME}"
            echo ""
            [ -f "$notes" ] && cat "$notes"
            echo ""
            if [ "${{ steps.package.outputs.notarized }}" = "true" ]; then
              echo "The macOS builds are signed and notarised, so they open without a warning."
            else
              echo "These macOS builds are **not notarised**: right-click ▸ Open the first time,"
              echo "or \`xattr -dr com.apple.quarantine\` the bundle."
            fi
            if [ "${{ steps.package.outputs.windows }}" = "true" ]; then
              echo ""
              echo "The Windows build is not signed, so SmartScreen will warn on first run."
            fi
          } > release-notes.txt
          cat release-notes.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.txt
          draft: false
          # A hyphen in the version is semver for a prerelease — v0.1.0-rc1 comes before v0.1.0 —
          # and GitHub marks whatever it publishes last as "Latest" unless told otherwise.
          # Without this a release candidate becomes the download on the front page, which is the
          # opposite of what calling it a candidate meant.
          prerelease: ${{ contains(github.ref_name, '-') }}
