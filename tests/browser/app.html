<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>jamin app check</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3.13.4/dist/vuetify.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />
    <link rel="stylesheet" href="../../src/styles/app.css" />
    <script type="importmap">
      {
        "imports": {
          "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.42/dist/vue.esm-browser.js",
          "vuetify": "https://cdn.jsdelivr.net/npm/vuetify@3.13.4/dist/vuetify.esm.js",
          "vue3-sfc-loader": "https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      /*
       * Mounts the real App.vue -- compiled by the real Vue SFC compiler, against
       * the real Vuetify build -- so the templates are checked for real: wrong
       * prop names, components that do not exist, bad slot usage.
       *
       * Only the bundler is simulated. Vite's job here is resolving bare
       * specifiers and CSS imports, which the import map and <link> tags cover.
       */
      import * as Vue from 'vue'
      import * as Vuetify from 'vuetify'
      import { loadModule } from 'vue3-sfc-loader'

      const results = []
      const problems = []
      // These tests deliberately provoke a blocked cross-origin fetch and a 404,
      // and the browser logs both no matter how cleanly we handle them.
      window.__expectedConsole = [
        'blocked by CORS policy',
        'net::ERR_FAILED',
        'status of 404',
        'nope\\.voc',
      ]
      const ok = (name, pass, detail = '') => results.push({ name, pass: !!pass, detail: String(detail) })
      // `ok` takes a boolean; `is` compares. Keeping them separate stops an
      // assertion from silently passing on truthiness.
      const is = (name, got, want) =>
        results.push({
          name,
          pass: JSON.stringify(got) === JSON.stringify(want),
          detail: JSON.stringify(got) === JSON.stringify(want) ? JSON.stringify(got) : `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`,
        })

      // The browser bundle groups these into namespaces; the npm package splits
      // them into `vuetify/components` and `vuetify/directives` subpaths.
      const components = Vuetify.components
      const directives = Vuetify.directives
      ok('vuetify components found', Object.keys(components).length > 50, Object.keys(components).length + ' components')

      // Every component the templates use must actually exist in this Vuetify.
      const sources = await Promise.all(
        ['../../src/App.vue', '../../src/components/ChordCanvas.vue', '../../src/components/SettingsDialog.vue', '../../src/components/PhraseBook.vue', '../../src/components/ProgressionBook.vue']
          .map((p) => fetch(p).then((r) => r.text()))
      )
      const used = new Set()
      for (const source of sources) {
        for (const match of source.matchAll(/<(v-[a-z0-9-]+)/g)) used.add(match[1])
      }
      const pascal = (tag) => tag.split('-').map((s) => s[0].toUpperCase() + s.slice(1)).join('')
      const missing = [...used].filter((tag) => !components[pascal(tag)])
      ok('every <v-*> tag exists in Vuetify', missing.length === 0, missing.join(', ') || [...used].length + ' tags checked')

      /*
       * Vue does not warn about a prop that does not exist -- it just becomes a
       * stray DOM attribute and silently does nothing. So check every attribute
       * we pass to a Vuetify component against that component's real props.
       */
      // `key` and `ref` are Vue's own reserved attributes, not component props.
      const NATIVE = new Set(['key', 'ref', 'class', 'style', 'id', 'title', 'href', 'target', 'rel', 'download', 'role', 'tabindex', 'aria-label', 'aria-hidden', 'spellcheck', 'autocomplete', 'autocapitalize', 'autocorrect', 'placeholder', 'type'])
      const strays = []
      // Consume each attribute together with its quoted value, so words inside
      // a label are never mistaken for prop names.
      const ATTR = /([:@#]?[a-zA-Z][\w:.-]*)(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+))?/g
      for (const source of sources) {
        for (const tag of source.matchAll(/<(v-[a-z0-9-]+)((?:\s[^>]*?)?)\/?>/g)) {
          const component = components[pascal(tag[1])]
          if (!component || !component.props) continue
          const props = new Set(Object.keys(component.props).map((k) => k.toLowerCase()))
          ATTR.lastIndex = 0
          let attr
          while ((attr = ATTR.exec(tag[2]))) {
            let name = attr[1]
            if (name.startsWith('@') || name.startsWith('#') || name.startsWith('v-')) continue
            if (name.startsWith(':')) name = name.slice(1)
            name = name.split('.')[0]
            if (NATIVE.has(name) || name.startsWith('data-') || name.startsWith('aria-')) continue
            const camel = name.replace(/-([a-z])/g, (_, c) => c.toUpperCase()).toLowerCase()
            if (!props.has(camel)) strays.push(`${tag[1]}[${name}]`)
          }
        }
      }
      ok('no unknown props passed to Vuetify components', strays.length === 0, strays.join(' ') || 'all attributes are real props')

      // The same goes for the global defaults block in src/plugins/vuetify.js.
      const pluginSource = await fetch('../../src/plugins/vuetify.js').then((r) => r.text())
      const defaultsBlock = pluginSource.slice(pluginSource.indexOf('defaults:'))
      const badDefaults = []
      for (const entry of defaultsBlock.matchAll(/(V[A-Za-z]+):\s*\{([^}]*)\}/g)) {
        const component = components[entry[1]]
        if (!component || !component.props) { badDefaults.push(entry[1] + '(unknown component)'); continue }
        const props = new Set(Object.keys(component.props).map((k) => k.toLowerCase()))
        for (const key of entry[2].matchAll(/([a-zA-Z][a-zA-Z0-9]*)\s*:/g)) {
          if (!props.has(key[1].toLowerCase())) badDefaults.push(`${entry[1]}.${key[1]}`)
        }
      }
      ok('plugin defaults name real props', badDefaults.length === 0, badDefaults.join(' ') || 'ok')

      const vuetify = Vuetify.createVuetify({
        components,
        directives,
        theme: { defaultTheme: 'jamin', themes: { jamin: { dark: true, colors: { background: '#0b0d14', surface: '#12151f', primary: '#7c5cff', secondary: '#22d3ee', error: '#ff5470' } } } },
        defaults: {
          VTextField: { variant: 'outlined', density: 'compact', hideDetails: 'auto' },
          VSelect: { variant: 'outlined', density: 'compact', hideDetails: 'auto' },
          VSlider: { density: 'compact', hideDetails: true, thumbSize: 14, trackSize: 3 },
          VSwitch: { density: 'compact', hideDetails: true, color: 'primary' },
          VBtn: { variant: 'tonal' },
        },
      })

      const options = {
        moduleCache: { vue: Vue },
        getFile: async (url) => {
          const res = await fetch(url)
          if (!res.ok) throw new Error(`${url} ${res.status}`)
          return { getContentData: (binary) => (binary ? res.arrayBuffer() : res.text()), type: '.' + url.split('.').pop() }
        },
        addStyle: (text) => {
          const style = document.createElement('style')
          style.textContent = text
          document.head.appendChild(style)
        },
        handleModule: async (type, getContentData, path, opts) => {
          // Plain .js modules load natively so they share one module registry
          // (and therefore one Vue, one store) with this page.
          if (type === '.js') return await import(new URL(path, location.href).href)
          if (type === '.css') { opts.addStyle(await getContentData(false)); return {} }
          if (type === '.json') return JSON.parse(await getContentData(false))
          return undefined
        },
        log: (level, ...args) => {
          if (level === 'error' || level === 'warn') problems.push(`sfc-${level}: ${args.join(' ')}`)
        },
      }

      let app = null
      try {
        const App = Vue.defineAsyncComponent(() => loadModule('../../src/App.vue', options))
        app = Vue.createApp({ render: () => Vue.h(App) })
        app.config.warnHandler = (msg, _vm, trace) => problems.push(`vue-warn: ${msg}`)
        app.config.errorHandler = (err) => problems.push(`vue-error: ${err && err.message ? err.message : err}`)
        app.use(vuetify)
        app.mount('#app')
        ok('App.vue compiles and mounts', true)
      } catch (err) {
        ok('App.vue compiles and mounts', false, err && err.message ? err.message : String(err))
      }

      const settle = (ms) => new Promise((r) => setTimeout(r, ms))
      const parseScoreForCheck = (text) => {
        const score = bootScore(text, { beatsPerBar: 4 })
        return { score, errors: score.tokens.filter((t) => t.type === 'error').map((t) => t.text) }
      }
      // Programmatic text changes reach the textarea through a watcher, so wait
      // for the mirror before touching the caret -- otherwise the watcher lands
      // afterwards and moves it, which made this suite flaky.
      const mirrored = async () => {
        const field = document.querySelector('.jamin-input')
        const store = await import('../../src/store.js')
        for (let i = 0; i < 60 && field && field.value !== store.state.text; i++) await settle(16)
        await settle(32)
      }
      await settle(1800)

      /*
       * This machine has a live MIDI clock running on an IAC bus, and jamin will
       * find it and start playing -- correct behaviour, and covered by the midi
       * suite, but it makes every assertion here a race. Unbind it.
       */
      const { parseScore: bootScore } = await import('../../src/core/score.js')
      const boot = await import('../../src/store.js')
      boot.state.settings.transport.autoDetectClock = false
      boot.state.settings.midi.clockInputId = ''
      boot.engine.autoDetectClock = false
      boot.engine.clockInputId = ''
      boot.engine.running = false
      boot.player.transport('stop')
      await settle(200)
      ok('transport parked for the UI tests', boot.engine.running === false)

      /* ---------- is the chart actually there? ---------- */
      const root = document.querySelector('.jamin-root')
      ok('chart root mounted', !!root)
      const canvases = document.querySelectorAll('.jamin-root canvas')
      ok('two canvas layers', canvases.length === 2, canvases.length)
      const field = document.querySelector('.jamin-input')
      ok('hidden textarea present', !!field)
      if (field) {
        ok('textarea holds the chart text', field.value.includes('Cmaj7'), JSON.stringify(field.value.slice(0, 24)))
        const box = field.getBoundingClientRect()
        ok('chart fills the viewport', Math.round(box.width) === window.innerWidth && Math.round(box.height) === window.innerHeight,
          `${Math.round(box.width)}x${Math.round(box.height)} vs ${window.innerWidth}x${window.innerHeight}`)
      }
      const painted = canvases[1] && canvases[1].getContext('2d').getImageData(0, 0, canvases[1].width, Math.min(400, canvases[1].height)).data
      if (painted) {
        let lit = 0
        for (let i = 3; i < painted.length; i += 4) if (painted[i] > 8) lit++
        ok('chart painted itself', lit > 2000, `${lit} px`)
      }
      ok('toolbar rendered', !!document.querySelector('.jamin-chrome .v-btn'))
      ok('readout rendered', !!document.querySelector('.jamin-readout'))

      /* ---------- typing goes in and comes back out ---------- */
      if (field) {
        field.focus()
        field.value = 'A- C B5 Dii'
        field.dispatchEvent(new Event('input', { bubbles: true }))
        await settle(300)
        const { state } = await import('../../src/store.js')
        ok('typing reaches the store', state.text === 'A- C B5 Dii', state.text)
        ok('typing reparses', state.score.events.length === 4, state.score.events.length)
        ok('chords parsed from typing', state.score.tokens.map((t) => t.chord && t.chord.ok).every(Boolean))
        ok('inversion parsed from typing', state.score.tokens[3].chord.inversion === 2, state.score.tokens[3].chord.inversion)
      }

      /* ---------- the dialogs ---------- */
      const { state } = await import('../../src/store.js')
      state.ui.settings = true
      await settle(700)
      const tabs = [...document.querySelectorAll('.v-tab')].map((t) => t.textContent.trim())
      ok('settings dialog opens', !!document.querySelector('.jamin-settings'), tabs.join('/'))
      ok('all eight settings tabs render', tabs.length >= 8, tabs.join('/'))
      ok('midi selects render', document.querySelectorAll('.jamin-settings .v-select').length >= 6,
        document.querySelectorAll('.jamin-settings .v-select').length)

      const visited = []
      for (const tab of ['transport', 'chords', 'display', 'themes', 'shaders', 'accompany', 'help']) {
        state.ui.settingsTab = tab
        await settle(260)
        const shown = document.querySelectorAll('.jamin-settings .v-window-item--active *').length
        visited.push(`${tab}:${shown}`)
        if (shown < 3) problems.push(`tab ${tab} rendered almost nothing`)
      }
      ok('every settings tab renders content', problems.filter((p) => p.startsWith('tab ')).length === 0, visited.join(' '))

      state.ui.settingsTab = 'themes'
      await settle(300)
      const swatches = document.querySelectorAll('.jamin-theme-swatch')
      ok('theme gallery renders', swatches.length === 8, swatches.length)
      swatches[2] && swatches[2].click()
      await settle(300)
      ok('picking a theme changes the settings', state.settings.theme.id === 'amber-crt', state.settings.theme.id)

      state.ui.settings = false
      await settle(400)
      state.ui.phrases = true
      await settle(500)
      const phraseTabs = [...document.querySelectorAll('.v-tab')].map((t) => t.textContent.trim())
      ok('phrase book opens', phraseTabs.some((t) => t.startsWith('Catalogue')), phraseTabs.join('/'))
      ok('there is no separate library any more', !phraseTabs.some((t) => t.startsWith('Library')), phraseTabs.join('/'))
      state.ui.phrasesTab = 'about'
      await settle(260)
      state.ui.phrasesTab = 'library'
      await settle(260)
      state.ui.phrases = false
      await settle(300)

      /* ---------- binding a phrase rewrites the chart ---------- */
      const store = await import('../../src/store.js')
      state.settings.accompany.perChordPhrases = true
      store.setText('C F G')
      await settle(250)
      store.state.phrases = [{ name: 'riff', notes: [{ at: 0, note: 60, velocity: 90, duration: 24 }], lengthPulses: 96, sourcePcs: [0, 4, 7], sourceChord: 'C' }]
      store.bindPhrase('riff', 0)
      await settle(250)
      ok('binding writes the dot into the chart', store.state.text === '.C{riff} F G', store.state.text)
      ok('the bound chord is marked', store.state.score.tokens[0].phraseChange === true)
      ok('the phrase carries forward', store.state.score.events.map((e) => e.phraseId).join(',') === 'riff,riff,riff',
        store.state.score.events.map((e) => e.phraseId).join(','))
      ok('the textarea mirrors the rewrite', field.value === '.C{riff} F G', field.value)
      state.settings.accompany.perChordPhrases = false
      await settle(200)

      /* ---------- a split bar must not double-time the phrase ---------- */
      const settingsModule = await import('../../src/core/settings.js')
      is('the shipped default keeps the rhythm', state.settings.accompany.fit, 'follow')
      is('and an install that predates that is corrected on load',
        settingsModule.migrateSettings({ version: 1, accompany: { fit: 'stretch' } }).accompany.fit, 'follow')

      store.state.phrases = [{
        name: 'pattern', rootPc: 0, sourcePcs: [0, 3, 7, 10], sourceChord: 'Cm7', lengthPulses: 96,
        notes: [[0, 60], [24, 63], [48, 67], [72, 70]].map(([at, note]) => ({ at, note, velocity: 90, duration: 12 })),
      }]
      store.setText('| Fm7 Gm7 |')
      await settle(250)
      store.bindPhrase('pattern')
      await settle(250)

      const tapeNotes = []
      const tape = { noteOn: (o, c, note) => { tapeNotes.push(note); return true }, noteOff: () => true }
      const { Player: SplitPlayer } = await import('../../src/core/player.js')
      const { parseScore: parseSplit } = await import('../../src/core/score.js')
      const rig = new SplitPlayer(tape, JSON.parse(JSON.stringify(state.settings)))
      rig.settings.midi.chordOutputId = 'x'
      rig.settings.chords.bassNote = false
      rig.getPhrase = (n) => (n === 'pattern' ? state.phrases[0] : null)
      rig.setScore(parseSplit('| Fm7 Gm7 |', { beatsPerBar: 4, songPhrase: 'pattern' }))
      const fired = []
      for (let p = 1; p <= 95; p++) { const before = tapeNotes.length; rig.tick(p); if (tapeNotes.length > before) fired.push(p) }

      is('four notes across the bar, not eight', tapeNotes.length, 4)
      // About a beat apart. The first lands on tick 1 rather than 0 because the
      // loop starts there; what matters is that it is a beat and not half of one.
      ok('spaced a beat apart, not half a beat',
        fired.every((at, i) => i === 0 || Math.abs(at - fired[i - 1] - 24) <= 1), fired.join(','))
      const degreeOver = (note, root) => ((note % 12) - root + 12) % 12
      is('the first half is harmonised as Fm7', tapeNotes.slice(0, 2).map((n) => degreeOver(n, 5)), [0, 3])
      is('the second half as Gm7, continuing the pattern', tapeNotes.slice(2).map((n) => degreeOver(n, 7)), [7, 10])

      store.bindPhrase(null)
      store.state.phrases = []
      await settle(200)

      /* ---------- bar lines: the conventional reading ---------- */
      store.setText('| Dm7 G7 | Cmaj7 | % |')
      await settle(300)
      is('two chords split a bar', state.score.events.slice(0, 2).map((e) => e.endPulse - e.startPulse), [48, 48])
      is('and the percent extends the next', state.score.events[2].bars, 2)
      // One bar of Dm7/G7, one of Cmaj7, and the percent makes that one two.
      is('three bars in all', state.score.bars, 3)
      ok('barline mode was detected', state.score.barlines === true)

      store.setText('| C / Am / |')
      await settle(250)
      is('a slash holds for a beat', state.score.events.map((e) => e.endPulse - e.startPulse), [48, 48])

      store.setText('C F G')
      await settle(250)
      ok('no bar lines means the shorthand', state.score.barlines === false)
      is('a space is a bar', state.score.bars, 3)

      // Repeats, both spellings.
      store.setText(':Am7 Am7 Bbmaj7 Bbmaj7:16')
      await settle(300)
      is('sixteen times through', state.score.bars, 64)
      is('still four typed chords', state.score.tokens.filter((t) => t.type === 'chord').length, 4)
      store.setText('|: Am7 | Bbmaj7 :|16')
      await settle(300)
      is('the conventional spelling matches', state.score.bars, 32)
      ok('repeat marks render as their own kind', state.score.tokens.some((t) => t.type === 'repeat'))

      // Harte is not mistaken for a repeat count when nothing is open.
      store.setText('C:7 F:maj7')
      await settle(250)
      is('harte survives', state.score.events.map((e) => e.chord.intervals.length), [4, 4])

      /* ---------- notation: the new spellings, in the real chart ---------- */
      store.setText('Fs7 As5 Csmin7 A/Cs Fsus4 N.C. C:maj7 C:maj(9) Ano3d')
      await settle(300)
      is('every spelling is readable', state.score.tokens.filter((t) => t.type === 'error').map((t) => t.text), [])
      is('s is a sharp', state.score.tokens[0].chord.rootPc, 6)
      is('As5 is A# with no third', state.score.tokens[1].chord.intervals, [0, 7])
      is('sus is not a sharp', state.score.tokens[4].chord.rootPc, 5)
      is('no chord is silent', state.score.tokens[5].chord.silent, true)
      is('harte parses', state.score.tokens[6].chord.intervals, [0, 4, 7, 11])
      is('harte parens add rather than extend', state.score.tokens[7].chord.intervals, [0, 4, 7, 14])
      is('no3d is understood', state.score.tokens[8].chord.intervals, [0, 7])

      /* ---------- the lick catalogue ---------- */
      store.setText('.G7 Cmaj7')
      await settle(250)
      // "Current chord" is the one under the cursor while stopped.
      await mirrored()
      field.focus()
      field.setSelectionRange(2, 2)
      await settle(150)
      is('the cursor picks the chord', store.targetChord().text, 'G7')
      state.ui.phrases = true
      state.ui.phrasesTab = 'licks'
      await settle(400)
      await store.ensureLicks()
      await settle(600)
      ok('the catalogue loaded', state.licks.length > 9000, `${state.licks.length} entries`)
      const partCount = state.licks.filter((l) => l.kind === 'part').length
      const lineCount = state.licks.length - partCount
      ok('two-handed parts are in there', partCount > 7000, `${partCount} parts`)
      ok('alongside the single-line licks', lineCount > 1500, `${lineCount} licks`)
      ok('every part really is two hands', state.licks.filter((l) => l.kind === 'part').every((l) => {
        const pitches = l.notes.map((n) => n.note)
        return l.voices >= 2 && Math.max(...pitches) - Math.min(...pitches) >= 14 &&
          new Set(pitches.map((p) => p % 12)).size >= 3
      }), true)
      ok('parts carry velocity from the performance', state.licks.some((l) => l.kind === 'part' &&
        new Set(l.notes.map((n) => n.velocity)).size > 1), true)
      ok('and are stored rooted on C', state.licks.filter((l) => l.kind === 'part').every((l) => l.rootPc === 0), true)

      // The texture filter separates them.
      state.ui.licksForCurrentChord = false
      state.ui.lickTexture = 'hands'
      await settle(150)
      ok('the texture filter shows only parts', store.visibleLicks('').every((l) => l.kind === 'part'), true)
      state.ui.lickTexture = 'line'
      await settle(150)
      ok('and only licks the other way', store.visibleLicks('').every((l) => l.kind !== 'part'), true)
      state.ui.lickTexture = 'any'
      state.ui.licksForCurrentChord = true
      await settle(150)
      const buildReport = state.lickReport
      ok('it was built in the page', !!buildReport && !buildReport.error, buildReport && buildReport.error)
      ok('from the shipped vocabulary', buildReport.source === 'Impro-Visor', buildReport.source)
      ok('multi-chord entries were skipped', buildReport.skipped.multiChord > 2000, JSON.stringify(buildReport.skipped))
      ok('the build is quick', buildReport.ms < 2000, `${buildReport.ms}ms for ${buildReport.bytes} bytes`)
      ok('every lick has notes', state.licks.every((l) => l.notes.length > 0))
      ok('every lick has a source chord', state.licks.every((l) => l.sourcePcs.length > 0))
      ok('notes are in a playable range', state.licks.every((l) => l.notes.every((n) => n.note >= 24 && n.note <= 108)))

      // Nothing is filtered by the chord: every phrase fits every chord, because
      // each is stored as degrees and re-pointed at whatever it lands on.
      const everything = store.visibleLicks('')
      is('the catalogue is not filtered by chord', everything.length, store.catalogue().length)
      ok('and it is not truncated either', everything.length > 9000, `${everything.length} entries`)
      ok('a search narrows it', store.visibleLicks('comp').length < everything.length,
        `${store.visibleLicks('comp').length} match "comp"`)
      // Check the dialog, not the document: body.textContent includes the text
      // of this very script, so asserting against it always finds the phrase.
      const dialogText = (document.querySelector('.v-overlay--active') || document.body).innerText
      ok('no switch offers to hide phrases that do not "fit"',
        !/only ones that fit/i.test(dialogText), dialogText.slice(0, 60).replace(/\n/g, ' '))

      const forG7 = everything

      // One button: using a phrase plays it, with no keeping step in between.
      const pick = forG7[0]
      store.usePhrase(pick)
      await settle(300)
      is('using it plays it over the whole song', state.songPhrase, pick.id)
      is('and leaves the chart alone', state.text, '.G7 Cmaj7')
      is('the phrase resolves from the catalogue', store.player.getPhrase(pick.id) !== null, true)
      is('stored rooted on C, not in its original key', pick.rootPc, 0)

      // The whole point: the same stored phrase over four different roots gives
      // the same degrees every time.
      const deg = (n, root) => ((n % 12) - root + 12) % 12
      const played = []
      const fake = {
        noteOn: (o, c, note) => { played.push(note); return true },
        noteOff: () => true,
      }
      const { Player } = await import('../../src/core/player.js')
      const { parseScore } = await import('../../src/core/score.js')
      const probe = new Player(fake, JSON.parse(JSON.stringify(state.settings)))
      probe.settings.midi.chordOutputId = 'x'

        const varint = (v) => { const out = [v & 0x7f]; v >>= 7; while (v > 0) { out.unshift((v & 0x7f) | 0x80); v >>= 7 } return out }
        const be = (v, n) => { const out = []; for (let i = n - 1; i >= 0; i--) out.push((v >> (i * 8)) & 0xff); return out }
        const chunk = (tag, body) => [...tag].map((c) => c.charCodeAt(0)).concat(be(body.length, 4), body)
        const PPQ = 480, BAR = PPQ * 4
        const bars = [[36, [60, 64, 67]], [38, [62, 65, 69, 72]], [43, [62, 65, 67, 71]], [41, [60, 64, 65, 69]]]
        const events = []
        bars.forEach(([bass, voicing], i) => {
          events.push({ tick: i * BAR, bytes: [0x90, bass, 90] }, { tick: i * BAR + BAR - 10, bytes: [0x80, bass, 0] })
          voicing.forEach((note, v) => {
            events.push({ tick: i * BAR + v * 240, bytes: [0x90, note, 80] })
            events.push({ tick: i * BAR + v * 240 + PPQ, bytes: [0x80, note, 0] })
          })
        })
        const body = []
        body.push(...varint(0), 0xff, 0x03, 5, ...[...'PIANO'].map((c) => c.charCodeAt(0)))
        let last = 0
        for (const e of events.sort((a, b) => a.tick - b.tick)) { body.push(...varint(e.tick - last), ...e.bytes); last = e.tick }
        body.push(...varint(0), 0xff, 0x2f, 0x00)
        return new Uint8Array(chunk('MThd', [...be(0, 2), ...be(1, 2), ...be(PPQ, 2)]).concat(chunk('MTrk', body)))
      })()

      store.saveProgression('Test save', 'A- F C G')
      await settle(120)
      is('saved into the library', store.state.progressions.length, before + 1)
      is('saved text kept verbatim', store.state.progressions[0].text, 'A- F C G')
      store.renameProgression('Test save', 'Renamed')
      await settle(120)
      is('renamed', store.state.progressions[0].name, 'Renamed')
      is('a name collision is resolved', store.saveProgression('Renamed', 'C G').name, 'Renamed 2')
      store.deleteProgression('Renamed')
      store.deleteProgression('Renamed 2')
      await settle(120)
      is('deleted', store.state.progressions.length, before)

      // A Hugging Face datasets-server response, in Chordonomicon's dialect.
      const hf = store.importProgressionJson(JSON.stringify({
        rows: [{ row_idx: 0, row: { id: 7, chords: '<verse_1> C Amin Fs7 Bmin <chorus_1> A/Cs Gsus4 Csus4', main_genre: 'rock', decade: 1970 } }],
      }))
      await settle(200)
      ok('imported a Hugging Face envelope', hf.ok, hf.error || '')
      is('converted the dialect', store.state.progressions[0].text,
        '[verse 1] C Amin F#7 Bmin\n[chorus 1] A/C# Gsus4 Csus4')
      is('named from metadata', store.state.progressions[0].name, 'rock 1970s #7')
      store.insertProgression(store.state.progressions[0], { mode: 'replace' })
      await settle(250)
      ok('every imported chord is readable', state.score.tokens.every((t) => t.type !== 'error'),
        state.score.tokens.filter((t) => t.type === 'error').map((t) => t.text).join(' '))
      is('labels do not consume bars', state.score.events.length, 7)
      is('labels are their own token type', state.score.tokens.filter((t) => t.type === 'label').map((t) => t.text),
        ['[verse 1]', '[chorus 1]'])
      store.deleteProgression(store.state.progressions[0].name)
      await settle(150)

      // Import a foreign shape, then export ours.
      const toKey = store.importProgressionJson('[{"title":"Into Eb","chords":["D-7","G7","C"]}]', { targetPc: 3 })
      await settle(150)
      ok('imports can be transposed on the way in', toKey.ok)
      is('into the key asked for', store.state.progressions[0].text, 'Eb-7 Ab7 Db')
      store.deleteProgression(store.state.progressions[0].name)
      await settle(120)

      const imported = store.importProgressionJson('[{"title":"From the wild","chords":["D-7","G7","C"],"genre":"jazz"}]')
      await settle(150)
      ok('imported a foreign shape', imported.ok && store.state.progressions[0].text === 'D-7 G7 C',
        store.state.progressions[0] && store.state.progressions[0].text)
      is('import keeps the tag', (store.state.progressions[0].tags || []).join(','), 'jazz')
      const exported = store.exportProgressionJson()
      ok('export is valid json', (() => { try { return !!JSON.parse(exported).progressions } catch { return false } })())
      store.deleteProgression('From the wild')
      await settle(120)

      ok('inserting closes the library', state.ui.progressions === false)
      state.ui.progressions = true
      state.ui.progressionsTab = 'save'
      await settle(500)
      ok('save tab renders', document.querySelectorAll('.v-window-item--active *').length > 3)
      state.ui.progressionsTab = 'transfer'
      await settle(300)
      ok('transfer tab renders a textarea', !!document.querySelector('.v-window-item--active textarea'))
      state.ui.progressions = false
      await settle(300)

      /*
       * Geometry invariants. Vuetify's `density="compact"` shrank the tab strip
       * below the height of its own tabs, quietly slicing every label in half --
       * nothing throws, nothing warns, it just looks broken. Measure instead.
       */
      const clipped = []
      for (const dialog of ['settings', 'phrases', 'progressions']) {
        state.ui[dialog] = true
        await settle(600)
        const strip = document.querySelector('.v-overlay--active .v-tabs')
        const tabs = [...document.querySelectorAll('.v-overlay--active .v-tab')]
        if (strip && tabs.length) {
          const box = strip.getBoundingClientRect()
          for (const tab of tabs) {
            const r = tab.getBoundingClientRect()
            if (r.bottom > box.bottom + 1 || r.top < box.top - 1) {
              clipped.push(`${dialog}:${tab.textContent.trim()} ${Math.round(r.height)}px in ${Math.round(box.height)}px`)
            }
          }
        }
        // Same class of bug one level down: a floating field label poking out
        // of the top of v-window, which clips its overflow.
        const clipperOf = (el) => {
          let node = el.parentElement
          while (node && node !== document.body) {
            const cs = getComputedStyle(node)
            if (/auto|scroll|hidden/.test(cs.overflowY) || /auto|scroll|hidden/.test(cs.overflowX)) return node
            node = node.parentElement
          }
          return null
        }
        for (const el of document.querySelectorAll('.v-overlay--active .v-field-label, .v-overlay--active .v-tab')) {
          const r = el.getBoundingClientRect()
          if (!r.height || !r.width) continue
          const box = clipperOf(el)
          if (!box) continue
          const b = box.getBoundingClientRect()
          const cut = Math.max(Math.round(b.top - r.top), Math.round(r.bottom - b.bottom))
          if (cut > 0.5) clipped.push(`${dialog}: "${el.textContent.trim()}" cut ${cut}px`)
        }
        state.ui[dialog] = false
        await settle(350)
      }
      ok('nothing is clipped in any dialog', clipped.length === 0, clipped.join(' | ') || 'all three dialogs measure clean')

      const dictionary = await import('../../src/core/chordDictionary.js')
      await dictionary.loadChordDictionary()
      ok('chord dictionary loads', dictionary.nameForSet([0, 4, 7]) === 'Major Triad', dictionary.nameForSet([0, 4, 7]))
      ok('dictionary names a dominant 9', dictionary.nameForSet([0, 4, 7, 10, 14]) === 'Dominant 7 (9)', dictionary.nameForSet([0, 4, 7, 10, 14]))
      ok('dictionary search works', dictionary.searchChords('half-dim', 5).length > 0)
      store.setText('Cmaj7')
      await settle(200)
      ok('readout names the typed chord', store.describeAt(2).includes('Major 7'), store.describeAt(2))

      window.__results = { results, warnings: problems }
      window.__done = true
    </script>
  </body>
</html>
